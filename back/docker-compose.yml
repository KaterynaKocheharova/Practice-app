services:
  db:
    image: postgres:18
    container_name: local_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local S3-compatible storage; console at http://localhost:9001.
  # MinIO no longer publishes free images; this is Bitnami's frozen build of the
  # MinIO server (fine for local dev, gets no updates).
  minio:
    image: bitnamilegacy/minio:2025.4.22
    container_name: local_minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # Created on startup if missing; private (no anonymous access)
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-app-documents}
      # Browsers upload straight to MinIO with presigned URLs
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
